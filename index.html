<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio de Selectores - UGB</title>
    <link rel="stylesheet" href="stilos.css">
</head>
<body>
    <h1>Manejo de DOM y Selectores JS</h1>
    
    <div class="contenedor-grid">
        <div class="tarjeta azul" id="caja-id">
            <h2>ID Selector</h2>
            <p>Haz clic aquí</p>
        </div>

        <div class="tarjeta amarillo tarjeta-clase">
            <h2>Class Selector</h2>
            <p>Pasa el mouse</p>
        </div>

        <section class="tarjeta naranja">
            <h2>Tag Selector</h2>
            <p>Doble clic en la sección</p>
        </section>

        <div class="tarjeta verde" data-tipo="especial">
            <h2>QuerySelector</h2>
            <p>Escribe algo abajo</p>
            <input type="text" class="input-estilo">
        </div>

        <div class="tarjeta lila">
            <h2>querySelectorAll</h2>
            <button class="btn-grupo">Botón 1</button>
            <button class="btn-grupo">Botón 2</button>
        </div>

        <div class="tarjeta rojo">
            <h2>CSS Selector</h2>
            <p>Haz foco en el campo</p>
            <input type="email" id="email-campo">
        </div>

        <div class="tarjeta morado">
            <h2>Form Selector</h2>
            <form id="form-datos">
                <button type="submit">Enviar</button>
            </form>
        </div>

        <div class="tarjeta rosa">
            <h2>Value Selector</h2>
            <select id="opciones">
                <option value="op1">Opción 1</option>
                <option value="op2">Opción 2</option>
            </select>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
